<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover">
    <title>SCOREPUNKT</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="manifest" href="manifest.json">
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      }
    </script>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700;900&family=Inter:wght@400;500;600;800;900&family=Permanent+Marker&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #ffcc00;
            --primary-glow: rgba(255, 204, 0, 0.4);
            --bg-dark: #09090b;
            --glass-bg: rgba(20, 20, 25, 0.65);
            --glass-border: rgba(255, 255, 255, 0.08);
            --danger: #ff3b30;
            --danger-glow: rgba(255, 59, 48, 0.4);
            --text-main: #ffffff;
            --text-muted: #a1a1aa;
            --info: #3b82f6;
        }

        * { 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent; 
            touch-action: pan-x pan-y; 
            margin: 0; padding: 0;
        }

        html, body { 
            height: 100%; width: 100%; overflow: hidden; 
            background: var(--bg-dark); 
            font-family: 'Inter', sans-serif; 
            position: fixed; 
            color: var(--text-main);
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
        }

        input, select, textarea, datalist { 
            font-size: 15px !important; outline: none !important; text-transform: uppercase; 
            background: rgba(0, 0, 0, 0.4); color: white; border: 1px solid var(--glass-border); 
            padding: 16px; border-radius: 14px; font-family: 'Inter'; width: 100%;
            transition: all 0.3s ease;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        }
        
        input:focus, select:focus { 
            border-color: var(--primary); 
            background: rgba(255, 204, 0, 0.05); 
            box-shadow: 0 0 0 3px var(--primary-glow);
        }
        
        button { 
            font-family: 'Inter', sans-serif;
            font-size: 16px !important; outline: none !important; 
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); 
            position: relative; overflow: hidden; 
            cursor: pointer;
            border-radius: 14px;
            display: flex; justify-content: center; align-items: center; gap: 8px;
        }
        button:active { transform: scale(0.95); }
        button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .btn-primary {
            background: linear-gradient(135deg, #ffcc00 0%, #d4a900 100%);
            color: #000; border: none; padding: 18px; font-weight: 900; 
            text-transform: uppercase; font-family: 'Oswald', sans-serif; 
            box-shadow: 0 10px 20px var(--primary-glow);
            letter-spacing: 0.5px;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            padding: 16px; font-weight: 700;
        }

        .mb-2 { margin-bottom: 8px; }
        .mb-3 { margin-bottom: 12px; }
        .mt-3 { margin-top: 12px; }
        .w-full { width: 100%; }

        #hero { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: linear-gradient(180deg, rgba(9, 9, 11, 0.4) 0%, rgba(9, 9, 11, 0.95) 100%), 
                        url('https://images.unsplash.com/photo-1504450758481-7338eba7524a?q=80&w=1500&auto=format&fit=crop') center/cover; 
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
            z-index: 6000; padding: 24px; 
            transition: opacity 0.5s ease;
        }
        
        .hero-logo { 
            font-family: 'Permanent Marker', cursive; 
            font-size: clamp(42px, 12vw, 64px); 
            color: var(--primary); 
            text-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 20px var(--primary-glow); 
            transform: rotate(-2deg); 
            margin-bottom: 0px; 
            letter-spacing: -1px;
            text-align: center;
        }

        .hero-subtitle { 
            font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 13px; 
            text-transform: uppercase; letter-spacing: 6px; color: var(--text-muted); 
            margin-bottom: 40px; 
        }
        
        .auth-box { 
            width: 100%; max-width: 400px; padding: 32px 24px;
            display: flex; flex-direction: column; gap: 16px; 
        }

        .home-lang-switch { display: flex; gap: 10px; justify-content: center; margin-top: 20px; }
        .home-lang-btn { 
            background: rgba(255,255,255,0.03); border: 1px solid var(--glass-border); 
            color: var(--text-muted); padding: 10px 24px; border-radius: 12px; 
            font-size: 12px; font-weight: 800; cursor: pointer; transition: 0.3s; 
        }
        .home-lang-btn.active { 
            border-color: var(--primary); color: var(--primary); 
            background: rgba(255, 204, 0, 0.1); box-shadow: 0 0 15px rgba(255, 204, 0, 0.1);
        }

        #search-container { 
            position: absolute; top: 20px; left: 20px; z-index: 5000; 
            display: flex; align-items: center; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            width: 48px; height: 48px; background: var(--glass-bg); 
            border-radius: 24px; backdrop-filter: blur(12px); overflow: hidden; 
            border: 1px solid var(--glass-border); box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        #search-container.expanded { width: calc(100% - 90px); border-color: var(--primary); background: rgba(10,10,15,0.9); }
        #city-search { 
            width: 100%; border: none; background: transparent; color: white; 
            padding: 12px 15px 12px 48px; font-size: 16px; outline: none; 
            opacity: 0; transition: 0.3s; pointer-events: none; box-shadow: none;
        }
        #search-container.expanded #city-search { opacity: 1; pointer-events: all; }
        .search-icon { 
            position: absolute; left: 14px; width: 20px; height: 20px; 
            filter: brightness(0) invert(1); opacity: 0.8; cursor: pointer; z-index: 5001; 
        }

        #map { width: 100vw; height: 100vh; background: #09090b; display: none; }
        
        .floating-action-btn {
            position: absolute; right: 20px; z-index: 5500;
            display: flex; justify-content: center; align-items: center; 
            cursor: pointer; backdrop-filter: blur(12px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            border-radius: 50%; border: 1px solid var(--glass-border);
            transition: transform 0.2s;
        }
        .floating-action-btn:active { transform: scale(0.9); }
        
        .location-btn { 
            bottom: 40px; width: 56px; height: 56px; 
            background: var(--primary); border: none; 
            box-shadow: 0 8px 24px var(--primary-glow); 
        }
        .location-btn img { filter: brightness(0); width: 24px; }
        
        .back-btn { 
            top: 20px; width: 48px; height: 48px; 
            background: var(--glass-bg); color: white; font-weight: bold; font-size: 18px;
        }
        .settings-btn { 
            top: 80px; width: 48px; height: 48px; 
            background: var(--glass-bg); 
        }
        .settings-btn img { width: 22px; filter: invert(1); opacity: 0.9; }

        .sport-marker-wrapper { display: flex; flex-direction: column; align-items: center; position: relative; }
        .marker-content-box { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; pointer-events: none; }
        .marker-content-box > * { pointer-events: auto; }

        .marker-ball-only { 
            font-size: 22px; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5)); 
            display: block; background: var(--glass-bg); backdrop-filter: blur(4px);
            padding: 8px; border-radius: 50%; border: 1px solid var(--glass-border); 
            transition: all 0.3s;
        }
        .zoom-near .marker-ball-only { display: none; }
        .status-live-wrapper .marker-ball-only { border-color: var(--primary); box-shadow: 0 0 15px var(--primary-glow); }

        .live-card-thin { 
            background: var(--glass-bg); backdrop-filter: blur(12px); border-radius: 12px; 
            display: none; flex-direction: column; width: 180px; 
            color: white; box-shadow: 0 10px 30px rgba(0,0,0,0.8); position: relative; 
            border: 1px solid var(--glass-border); border-left: 4px solid #ff9500; 
            overflow: hidden; z-index: 25; margin-bottom: 4px;
        }
        .zoom-near .live-card-thin { display: flex; animation: slideUpFade 0.3s ease-out; }
        
        .status-live-wrapper .live-card-thin { border-left-color: var(--primary); border-top-color: rgba(255,204,0,0.2); }
        .status-live-wrapper .card-league-mini { background: rgba(255, 204, 0, 0.1); color: var(--primary); border-bottom: 1px solid rgba(255,204,0,0.1); }
        
        .card-league-mini { 
            font-size: 10px; background: rgba(0,0,0,0.5); color: var(--text-muted); 
            font-weight: 800; padding: 6px 10px; text-transform: uppercase; 
            letter-spacing: 1px; width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            border-bottom: 1px solid var(--glass-border);
        }

        .score-row { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 8px 10px; border-bottom: 1px solid rgba(255,255,255,0.05); 
            background: rgba(0,0,0,0.2); gap: 8px;
        }
        .team-name-col { 
            font-size: 12px; font-weight: 700; text-transform: uppercase; color: #fff; 
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; 
        }
        .score-val-col { 
            font-family: 'Oswald', sans-serif; font-size: 16px; color: var(--primary); 
            font-weight: 700; background: rgba(0,0,0,0.4); width: 32px; height: 28px;
            display: flex; justify-content: center; align-items: center; 
            border-radius: 6px; flex-shrink: 0; box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
        }

        .card-footer-info {
            display: flex; justify-content: space-between; align-items: center; 
            padding: 6px 10px; background: rgba(0,0,0,0.6);
        }
        .card-time-mini { font-size: 10px; color: #ff9500; font-weight: 700; }
        .blink-live-tag { 
            background: rgba(255, 204, 0, 0.15); color: var(--primary); font-size: 10px; font-weight: 900; 
            padding: 2px 8px; border-radius: 4px; border: 1px solid rgba(255, 204, 0, 0.3);
            animation: soft-blink 2s infinite; 
        }

        .marker-pointer {
            width: 0; height: 0;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-top: 10px solid #ff9500;
            display: none; margin-bottom: 10px;
            filter: drop-shadow(0 4px 4px rgba(0,0,0,0.5));
        }
        .zoom-near .marker-pointer { display: block; }
        .status-live-wrapper .marker-pointer { border-top-color: var(--primary); }

        #match-details-view { 
            position: fixed; bottom: -100%; left: 0; width: 100%; max-height: 90vh; 
            background: var(--glass-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            z-index: 8000; border-top: 1px solid var(--glass-border); 
            border-radius: 28px 28px 0 0; padding: 0; 
            transition: bottom 0.5s cubic-bezier(0.32, 0.72, 0, 1); 
            overflow-y: auto; color: white; box-shadow: 0 -10px 40px rgba(0,0,0,0.8);
        }
        #match-details-view.active { bottom: 0; }
        
        .drag-handle {
            width: 40px; height: 5px; background: rgba(255,255,255,0.2); 
            border-radius: 3px; margin: 12px auto;
        }

        .details-top-bar { 
            padding: 0 20px 15px; text-align: center; border-bottom: 1px solid var(--glass-border); position: relative; 
        }
        .close-btn-sheet {
            position: absolute; right: 20px; top: 0px; width: 36px; height: 36px;
            background: rgba(255,255,255,0.1); border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            font-size: 20px; color: var(--text-muted); cursor: pointer;
        }
        .details-league { color: var(--primary); font-weight: 900; font-size: 14px; letter-spacing: 2px; text-transform: uppercase; }
        
        .details-scoreboard { 
            padding: 30px 20px; display: flex; flex-direction: column; align-items: center; 
            border-bottom: 1px solid var(--glass-border);
            background: linear-gradient(180deg, rgba(255,255,255,0.03) 0%, transparent 100%);
        }
        .det-teams-row { 
            display: flex; justify-content: space-between; align-items: center; 
            width: 100%; max-width: 500px; margin-bottom: 20px; gap: 15px;
        }
        .det-team-box { flex: 1; min-width: 0; text-align: center; }
        .det-team-name { 
            font-size: 16px; font-weight: 900; text-transform: uppercase; color: #fff; 
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }
        .det-vs-label { 
            font-family: 'Oswald'; font-size: 14px; color: var(--text-muted); 
            font-weight: 700; width: 30px; text-align: center; flex-shrink: 0;
            background: rgba(255,255,255,0.1); padding: 4px 0; border-radius: 6px;
        }

        .det-score-row { 
            background: rgba(0,0,0,0.4); border-radius: 16px; padding: 10px 40px; 
            display: flex; justify-content: center; align-items: center; 
            border: 1px solid rgba(255, 204, 0, 0.2); box-shadow: inset 0 2px 10px rgba(0,0,0,0.5), 0 10px 30px rgba(0,0,0,0.3);
        }
        .det-score-main { 
            font-family: 'Oswald'; font-size: 42px; font-weight: 900; 
            color: var(--primary); letter-spacing: 6px; white-space: nowrap;
            text-shadow: 0 0 20px var(--primary-glow);
        }
        
        .details-content { padding: 24px; }
        
        #admin-panel { 
            position: fixed; top: 0; left: 100%; width: 100%; height: 100%; 
            background: var(--bg-dark); z-index: 9000; 
            transition: left 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94); 
            display: flex; flex-direction: column; overflow-y: auto; 
        }
        #admin-panel.active { left: 0; }

        .admin-header {
            padding: 20px 24px; background: rgba(0,0,0,0.5); border-bottom: 1px solid var(--glass-border);
            display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 10;
            backdrop-filter: blur(10px);
        }
        
        .admin-content-scroll { padding: 24px; display: flex; flex-direction: column; gap: 16px; flex-grow: 1; }

        .admin-score-hero {
            background: linear-gradient(145deg, rgba(30,30,35,1) 0%, rgba(15,15,20,1) 100%);
            border: 1px solid var(--primary); padding: 30px 20px; text-align: center; 
            border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.5), inset 0 2px 0 rgba(255,255,255,0.05);
            position: relative; overflow: hidden;
        }
        .admin-score-hero::before {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle, var(--primary-glow) 0%, transparent 60%);
            opacity: 0.1; pointer-events: none;
        }

        .score-ctrl-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
        }
        
        .team-ctrl-card {
            background: var(--glass-bg); border: 1px solid var(--glass-border);
            border-radius: 16px; padding: 16px; text-align: center;
        }
        
        .team-ctrl-lbl {
            font-size: 13px; color: var(--text-muted); font-weight: 800; 
            text-transform: uppercase; margin-bottom: 12px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        .ctrl-btn-group {
            display: flex; justify-content: center; flex-wrap: wrap; gap: 8px;
        }

        .btn-ctrl {
            width: auto; padding: 0 15px; height: 45px; border-radius: 12px; font-size: 16px !important;
            font-family: 'Oswald', sans-serif; font-weight: 500;
            display: flex; justify-content: center; align-items: center; border: none;
            cursor: pointer; transition: transform 0.1s, background 0.2s;
        }
        .btn-ctrl.minus { background: rgba(255,59,48,0.2); color: var(--danger); border: 1px solid rgba(255,59,48,0.4); }
        .btn-ctrl.minus:active { background: rgba(255,59,48,0.4); transform: scale(0.9); }
        .btn-ctrl.plus { background: var(--glass-bg); border: 1px solid var(--glass-border); color: white; }
        .btn-ctrl.plus:active { background: var(--primary); color: #000; transform: scale(0.9); }
        .btn-ctrl:disabled { opacity: 0.3; cursor: not-allowed; }

        .adm-event-list { display: flex; flex-direction: column; gap: 8px; max-height: 250px; overflow-y: auto; }
        .adm-event-item { 
            background: rgba(0,0,0,0.3); padding: 12px 16px; border-radius: 12px; 
            display: flex; justify-content: space-between; align-items: center; 
            border: 1px solid var(--glass-border); border-left: 3px solid var(--primary);
        }
        .adm-event-item span { font-size: 14px; font-weight: 700; color: #fff; text-transform: uppercase; }
        .adm-event-remove { 
            color: var(--danger); font-size: 22px; cursor: pointer; 
            width: 32px; height: 32px; display: flex; justify-content: center; align-items: center;
            background: rgba(255,59,48,0.1); border-radius: 8px; transition: 0.2s;
        }
        .adm-event-remove:active { transform: scale(0.9); background: rgba(255,59,48,0.3); }

        .action-btn-row { display: flex; flex-direction: column; gap: 12px; margin-top: 10px; }

        @keyframes soft-blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        @keyframes slideUpFade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .user-location-dot { 
            background: #0a84ff; width: 16px; height: 16px; 
            border: 3px solid white; border-radius: 50%; box-shadow: 0 0 15px #0a84ff; 
        }
        @keyframes pulse-circle {
            0% { stroke-opacity: 0.8; stroke-width: 1px; }
            50% { stroke-opacity: 0.3; stroke-width: 3px; }
            100% { stroke-opacity: 0.8; stroke-width: 1px; }
        }
        .animated-range-circle { animation: pulse-circle 4s infinite ease-in-out; }
        
        .leaflet-popup-content-wrapper { background: var(--glass-bg); backdrop-filter: blur(15px); color: white; border-radius: 16px; border: 1px solid var(--glass-border); padding: 0; overflow: hidden; }
        .leaflet-popup-tip { background: var(--glass-bg); }
        .leaflet-popup-content { margin: 0; }
        
        #lang-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); z-index: 10000; display: none; justify-content: center; align-items: center; }
        .lang-box { background: var(--bg-dark); padding: 32px; border-radius: 24px; border: 1px solid var(--glass-border); width: 85%; max-width: 320px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

    <div id="hero">
        <div class="hero-logo">SCOREPUNKT</div>
        <div class="hero-subtitle" id="txt-subtitle">Result Tracker</div>
        
        <div class="auth-box glass-panel">
            <input type="email" id="email" placeholder="EMAIL ADDRESS">
            <input type="password" id="password" placeholder="PASSWORD">
            
            <button class="btn-primary mt-3" id="btn-login" onclick="handleAuth()">ULAZ U SISTEM</button>
            
            <button id="btn-explore" onclick="exploreMap()" style="background:none; border:none; color:var(--text-muted); cursor:pointer; font-weight:700; margin-top:8px; font-size:12px; text-transform:uppercase; letter-spacing:1px; width: 100%;">
                ISTRAŽI MAPU BEZ PRIJAVE
            </button>

            <div class="home-lang-switch">
                <div class="home-lang-btn" id="h-lang-sr" onclick="setLanguage('sr')">SRB</div>
                <div class="home-lang-btn" id="h-lang-en" onclick="setLanguage('en')">ENG</div>
            </div>
        </div>
        
        <div style="margin-top:auto; color:rgba(255,255,255,0.3); font-size:10px; letter-spacing:2px; font-weight:700;">© 2026 SCOREPUNKT MOBILE</div>
    </div>

    <div id="map"></div>
    
    <div id="ui-controls" style="display:none;">
        <div id="search-container">
            <img src="https://cdn-icons-png.flaticon.com/512/622/622669.png" class="search-icon" onclick="toggleSearch()" alt="Search">
            <input type="text" id="city-search" placeholder="Pretraži..." onkeypress="handleSearch(event)">
        </div>
        
        <div class="floating-action-btn back-btn" onclick="goBackToLogin()">&#10006;</div>
        <div class="floating-action-btn settings-btn" onclick="toggleLangModal()">
            <img src="https://cdn-icons-png.flaticon.com/512/126/126472.png" alt="Settings">
        </div>
        <div class="floating-action-btn location-btn" onclick="goToMyLocation()">
            <img src="https://cdn-icons-png.flaticon.com/512/1865/1865269.png" alt="Location">
        </div>
        
        <div id="user-indicator" style="position:fixed; bottom:15px; left:15px; color:var(--primary); font-size:11px; font-weight:800; z-index:5000; opacity: 0.7; background: rgba(0,0,0,0.5); padding: 6px 12px; border-radius: 20px; backdrop-filter: blur(4px);"></div>
    </div>

    <div id="lang-modal" onclick="toggleLangModal()">
        <div class="lang-box" onclick="event.stopPropagation()">
            <h3 style="color:white; margin-bottom:24px; font-family:'Oswald'; letter-spacing: 1px;" id="lang-title">JEZIK / LANGUAGE</h3>
            <button class="btn-secondary w-full mb-3" onclick="setLanguage('sr')">SRPSKI</button>
            <button class="btn-secondary w-full" onclick="setLanguage('en')">ENGLISH</button>
        </div>
    </div>

    <div id="match-details-view">
        <div class="drag-handle"></div>
        <div class="details-top-bar">
            <div class="close-btn-sheet" onclick="closeDetails()">&times;</div>
            <span id="det-league" class="details-league"></span>
            <div id="det-time" style="font-size:12px; color:var(--text-muted); margin-top:6px; font-weight: 500;"></div>
            <div id="det-status-badge" style="font-size:12px; color:var(--primary); font-weight: 800; margin-top:4px;"></div>
        </div>
        
        <div class="details-scoreboard">
            <div class="det-teams-row">
                <div class="det-team-box"><div id="det-t1" class="det-team-name"></div></div>
                <div class="det-vs-label">VS</div>
                <div class="det-team-box"><div id="det-t2" class="det-team-name"></div></div>

        const translations = {
            sr: { subtitle: "Result Tracker", login: "ULAZ U SISTEM", explore: "ISTRAŽI MAPU BEZ PRIJAVE", search: "Pretraži...", periodRes: "Rezultat po periodima", matchEvents: "Događaji na meču", adminTitle: "ADMIN TABLA", nextPeriod: "⏭️ SLEDEĆI PERIOD / SET", goLive: "KRENI UŽIVO", endMatch: "ZAVRŠI MEČ", resetMatch: "RESET / NOVI MEČ", schedule: "ZAKAŽI MEČ", deleteCourt: "OBRIŠI TEREN", zoneOccupied: "ZONA ZAUZETA!", create: "KRENI", courtName: "NAZIV TERENA", player: "IME IGRAČA", team: "TIM", loggedAs: "ULOGOVAN KAO:", localMatch: "LOKALNI MEČ", points: "POENI", games: "GEMOVI", league: "LIGA (NOVA)", team1: "TIM 1", team2: "TIM 2", goal: "GOL", yellow: "ŽUTI", red: "CRVENI", confirmDelete: "OBRISATI?", timeAt: "U", live: "UŽIVO", limitReached: "LIMIT OD 3 TERENA JE DOSTIGNUT!", addCourt: "DODAJ TEREN", pens: "Penali" },
            en: { subtitle: "Result Tracker", login: "ENTER SYSTEM", explore: "EXPLORE MAP WITHOUT LOGIN", search: "Search...", periodRes: "Period Results", matchEvents: "Match Events", adminTitle: "ADMIN PANEL", nextPeriod: "⏭️ NEXT PERIOD / SET", goLive: "GO LIVE", endMatch: "END MATCH", resetMatch: "RESET / NEW MATCH", schedule: "SCHEDULE MATCH", deleteCourt: "DELETE COURT", zoneOccupied: "ZONE OCCUPIED!", create: "CREATE", courtName: "COURT NAME", player: "PLAYER NAME", team: "TEAM", loggedAs: "LOGGED AS:", localMatch: "LOCAL MATCH", points: "POINTS", games: "GAMES", league: "LEAGUE (NEW)", team1: "TEAM 1", team2: "TEAM 2", goal: "GOAL", yellow: "YELLOW", red: "RED", confirmDelete: "DELETE?", timeAt: "AT", live: "LIVE", limitReached: "LIMIT OF 3 COURTS REACHED!", addCourt: "ADD COURT", pens: "Pens" }
        };

        function setLanguage(lang) { 
            currentLang = lang; 
            localStorage.setItem('lang', lang); 
            updateUILanguage(); 
            if(document.getElementById('lang-modal').style.display === 'flex') toggleLangModal(); 
            if(currentAdminKey) refreshAdminPanel(currentAdminKey); 
            renderMarkers();
        }
        
        function updateUILanguage() { 
            const t = translations[currentLang]; 
            document.getElementById('txt-subtitle').innerText = t.subtitle; 
            document.getElementById('btn-login').innerText = t.login; 
            document.getElementById('btn-explore').innerText = t.explore; 
            document.getElementById('city-search').placeholder = t.search; 
            document.getElementById('txt-match-events').innerText = t.matchEvents; 
            document.getElementById('adm-name').innerText = t.adminTitle; 
            document.getElementById('btn-next-period').innerText = t.nextPeriod; 
            document.getElementById('start-live-btn').innerText = t.goLive; 
            document.getElementById('end-match-btn').innerText = t.endMatch; 
            document.getElementById('reset-match-btn').innerText = t.resetMatch; 
            document.getElementById('btn-schedule').innerText = t.schedule; 
            document.getElementById('btn-delete-court').innerText = t.deleteCourt; 
            document.getElementById('adm-league-input').placeholder = t.league; 
            document.getElementById('adm-t1').placeholder = t.team1 + " (MAX 10)"; 
            document.getElementById('adm-t2').placeholder = t.team2 + " (MAX 10)"; 
            document.getElementById('h-lang-sr').classList.toggle('active', currentLang === 'sr'); 
            document.getElementById('h-lang-en').classList.toggle('active', currentLang === 'en'); 
            if(auth.currentUser) document.getElementById('user-indicator').innerText = `${t.loggedAs} ${auth.currentUser.email}`; 
        }

        function toggleLangModal() { 
            let m = document.getElementById('lang-modal'); 
            m.style.display = (m.style.display === 'flex') ? 'none' : 'flex'; 
        }
        
        function exploreMap() { 
            document.getElementById('hero').style.opacity = '0'; 
            setTimeout(() => {
                document.getElementById('hero').style.display = 'none'; 
                document.getElementById('map').style.display = 'block'; 
                document.getElementById('ui-controls').style.display = 'block'; 
                initMap(); 
                updateUILanguage(); 
                loadSuggestions(); 
            }, 500);
        }
        
        function goBackToLogin() { auth.signOut(); location.reload(); }
        auth.onAuthStateChanged(user => { if (user) exploreMap(); else updateUILanguage(); });
        
        function loadSuggestions() { 
            db.ref('suggestions/leagues').on('value', snap => { 
                let dl = document.getElementById('league-list'); dl.innerHTML = ""; 
                snap.forEach(s => dl.innerHTML += `<option value="${s.val()}">`); 
            }); 
            db.ref('suggestions/teams').on('value', snap => { 
                let dl = document.getElementById('team-list'); dl.innerHTML = ""; 
                snap.forEach(s => dl.innerHTML += `<option value="${s.val()}">`); 
            }); 
        }
        
        function saveSuggestion(type, value) { 
            if(!value) return; 
            const ref = db.ref(`suggestions/${type}`); 
            ref.once('value', snap => { 
                let ex = false; snap.forEach(s => { if(s.val() === value) ex = true; }); 
                if(!ex) ref.push(value); 
            }); 
        }

        function initMap() {
            if (map) return;
            const sLat = localStorage.getItem('lastLat') || 44.7866, sLng = localStorage.getItem('lastLng') || 20.4489, sZoom = localStorage.getItem('lastZoom') || 13;
            map = L.map('map', { zoomControl: false, tap: false }).setView([sLat, sLng], sZoom);
            L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}').addTo(map);
            L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', { opacity: 0.8 }).addTo(map);
            
            rangeCircle = L.circle([sLat, sLng], { 
                radius: 30000, color: 'var(--primary)', weight: 1, fillOpacity: 0.03, interactive: false, className: 'animated-range-circle' 
            }).addTo(map);

            map.on('move', () => { 
                let c = map.getCenter(); rangeCircle.setLatLng(c); 
                if(map.getZoom() > 10) rangeCircle.setStyle({opacity: 0, fillOpacity: 0}); 
                else rangeCircle.setStyle({opacity: 1, fillOpacity: 0.03}); 
            });
            map.on('moveend', () => { 
                let c = map.getCenter(); 
                localStorage.setItem('lastLat', c.lat); 
                localStorage.setItem('lastLng', c.lng); 
                localStorage.setItem('lastZoom', map.getZoom()); 
                renderMarkers(); 
            });
            map.on('click', handleMapClick);
            db.ref('tereni').on('value', snap => { 
                allTereni = []; 
                snap.forEach(c => { let d = c.val(); d.key = c.key; allTereni.push(d); }); 
                renderMarkers(); 
                if(currentAdminKey) refreshAdminPanel(currentAdminKey); 
            });
            trackGPS();
        }

        function renderMarkers() {
            if (!map) return;
            const center = map.getCenter();
            map.eachLayer(l => { if(l instanceof L.Marker && l !== userMarker) map.removeLayer(l); });
            const zoomNear = map.getZoom() > 12;
            const t = translations[currentLang];
            
            allTereni.forEach(d => {
                if (map.distance(center, [d.lat, d.lng]) > 30000) return;
                const isLive = d.status === 'live', isEnded = d.status === 'ended', isUpcoming = d.status === 'upcoming' && d.t1;
                const ball = sportEmojis[d.sport] || '⚽';
                let cardBody = "";
                
                if (isLive || isEnded || isUpcoming) {
                    let s1 = (isLive || isEnded) ? (d.score1 || 0) : "-";
                    let s2 = (isLive || isEnded) ? (d.score2 || 0) : "-";
                    
                    // Display subscores if Volleyball/Tennis
                    if ((d.sport === "ODBOJKA" || d.sport === "TENIS") && (isLive || isEnded)) {
                        let sub1 = d.sub_home || 0, sub2 = d.sub_away || 0;
                        if(d.sport === "TENIS") {
                            const isTB = (sub1 === 6 && sub2 === 6);
                            let pt1 = isTB ? (d.pts_home || 0) : (tennisPoints[d.pts_home] || "0");
                            let pt2 = isTB ? (d.pts_away || 0) : (tennisPoints[d.pts_away] || "0");
                            s1 = `${s1} (${sub1}|${pt1})`;
                            s2 = `${s2} (${sub2}|${pt2})`;
                        } else {
                            s1 = `${s1} (${sub1})`;
                            s2 = `${s2} (${sub2})`;
                        }
                    }

                    let footer = isLive ? `<div class="blink-live-tag">${t.live}</div>` : (d.match_time ? `<div class="card-time-mini">${new Date(d.match_time).toLocaleDateString([],{day:'2-digit',month:'2-digit'})} ${t.timeAt} ${new Date(d.match_time).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</div>` : "");
                    cardBody = `<div class="live-card-thin"><div class="card-league-mini">${d.league || t.localMatch}</div><div class="score-row"><span class="team-name-col">${d.t1}</span><span class="score-val-col" style="width:auto; padding:0 6px;">${s1}</span></div><div class="score-row" style="border:none;"><span class="team-name-col">${d.t2}</span><span class="score-val-col" style="width:auto; padding:0 6px;">${s2}</span></div><div class="card-footer-info"><span style="font-size:12px;">${ball}</span>${footer}</div></div><div class="marker-pointer"></div>`;
                } else {
                    cardBody = `<div class="live-card-thin" style="padding:12px; text-align:center; font-weight:800; font-size:12px; color:var(--primary); border-left:4px solid rgba(255,255,255,0.2);">${ball} ${d.name}</div><div class="marker-pointer"></div>`;
                }
                const html = `<div class="sport-marker-wrapper ${isLive?'status-live-wrapper':''} ${zoomNear?'zoom-near':''}"><div class="marker-content-box"><div class="marker-ball-only">${ball}</div>${cardBody}</div></div>`;
                L.marker([d.lat, d.lng], { icon: L.divIcon({ className: '', html, iconSize: [0,0], iconAnchor: [0, 0] }) }).addTo(map).on('click', e => { 
                    L.DomEvent.stopPropagation(e); 
                    if (auth.currentUser && d.owner === auth.currentUser.uid) openAdmin(d.key); 
                    else openDetails(d.key); 
                });
            });
        }

        function handleMapClick(e) { 
            if (!auth.currentUser) return; 
            const t = translations[currentLang]; 
            const clickPos = e.latlng; 
            const isTooClose = allTereni.some(court => { const courtLatLng = L.latLng(court.lat, court.lng); return clickPos.distanceTo(courtLatLng) < 200; });
            if (isTooClose) { alert(t.zoneOccupied); return; } 
            
            const html = `
                <div style="padding:16px; text-align:center;">
                    <h3 style="margin-bottom:16px; font-family:'Oswald'; color:white; font-size:16px;">${t.addCourt || 'DODAJ TEREN'}</h3>
                    <select id="p_sport" class="mb-3">
                        <option value="FUDBAL">⚽ FUDBAL</option>
                        <option value="KOŠARKA">🏀 KOŠARKA</option>
                        <option value="ODBOJKA">🏐 ODBOJKA</option>
                        <option value="TENIS">🎾 TENIS</option>
                        <option value="RUKOMET">🤾 RUKOMET</option>
                    </select>
                    <input type="text" id="p_name" placeholder="${t.courtName}" maxlength="15" class="mb-3">
                    <button onclick="saveTeren(${e.latlng.lat}, ${e.latlng.lng})" class="btn-primary w-full">${t.create}</button>
                </div>`; 
            L.popup().setLatLng(e.latlng).setContent(html).openOn(map); 
        }

        function openDetails(key) { 
            const d = allTereni.find(x => x.key === key); 
            if(!d) return; 
            const t = translations[currentLang]; 
            const config = sportsConfig[d.sport];
            
            document.getElementById('det-league').innerText = d.league || t.localMatch; 
            document.getElementById('det-time').innerText = d.match_time ? new Date(d.match_time).toLocaleString() : ""; 
            document.getElementById('det-t1').innerText = d.t1 || t.team1; 
            document.getElementById('det-t2').innerText = d.t2 || t.team2; 
            document.getElementById('det-score').innerText = `${d.score1||0} : ${d.score2||0}`; 
            
            // Status/Period Badge
            const pIdx = d.periodIdx || 0;
            document.getElementById('det-status-badge').innerText = (d.status === 'upcoming') ? t.timeAt : (config.periods[pIdx][currentLang] || config.periods[pIdx].en);

            // Sub Scores (Volley/Tennis)
            let subScoreEl = document.getElementById('det-sub-score');
            if (d.sport === "ODBOJKA") {
                subScoreEl.innerText = `${t.points}: ${d.sub_home||0} - ${d.sub_away||0}`;
                subScoreEl.style.display = 'block';
            } else if (d.sport === "TENIS") {
                let sub1 = d.sub_home || 0, sub2 = d.sub_away || 0;
                const isTB = (sub1 === 6 && sub2 === 6);
                let pt1 = isTB ? (d.pts_home || 0) : (tennisPoints[d.pts_home] || "0");
                let pt2 = isTB ? (d.pts_away || 0) : (tennisPoints[d.pts_away] || "0");
                subScoreEl.innerText = `${t.games}: ${sub1}:${sub2} | ${t.points}: ${pt1}:${pt2}`;
                subScoreEl.style.display = 'block';
            } else {
                subScoreEl.style.display = 'none';
            }

            // Penalties
            let penScoreEl = document.getElementById('det-pen-score');
            if (d.pen_home > 0 || d.pen_away > 0) {
                penScoreEl.innerText = `${t.pens}: (${d.pen_home}) - (${d.pen_away})`;
                penScoreEl.style.display = 'block';
            } else {
                penScoreEl.style.display = 'none';
            }
            
            // Events
            let eHome = document.getElementById('det-events-home'), eAway = document.getElementById('det-events-away'); 
            eHome.innerHTML = ""; eAway.innerHTML = ""; 
            if(d.events && config.hasEvents) { 
                document.getElementById('det-stats-container').style.display = 'block'; 
                Object.values(d.events).forEach(ev => { 
                    const row = `<div style="font-size:13px; font-weight:700; color:#fff; padding:6px; background:rgba(255,255,255,0.05); border-radius:6px; border:1px solid rgba(255,255,255,0.05);">${ev.emoji} ${ev.player}</div>`; 
                    if(ev.team == 1) eHome.innerHTML += row; else eAway.innerHTML += row; 
                }); 
            } else document.getElementById('det-stats-container').style.display = 'none'; 
            
            document.getElementById('match-details-view').classList.add('active'); 
        }

        function openAdmin(key) { 
            currentAdminKey = key; 
            refreshAdminPanel(key); 
            document.getElementById('admin-panel').classList.add('active'); 
        }
        function closeAdmin() { 
            document.getElementById('admin-panel').classList.remove('active'); 
            currentAdminKey = null; 
        }
        
        function refreshAdminPanel(key) {
            const d = allTereni.find(x => x.key === key); if(!d) return; 
            const t = translations[currentLang];
            const config = sportsConfig[d.sport];
            const isLive = d.status === 'live';
            
            document.getElementById('adm-name').innerText = d.name; 
            document.getElementById('adm-main-score').innerText = `${d.score1 || 0} : ${d.score2 || 0}`;
            
            // Period Status
            const pIdx = d.periodIdx || 0;
            document.getElementById('adm-period-status').innerText = config.periods[pIdx][currentLang] || config.periods[pIdx].en;

            // Sub Scores Display
            let subDisplay = document.getElementById('adm-sub-display');
            if (d.sport === "ODBOJKA") {
                subDisplay.innerText = `${t.points}: ${d.sub_home||0} - ${d.sub_away||0}`;
                subDisplay.style.display = 'block';
            } else if (d.sport === "TENIS") {
                let sub1 = d.sub_home || 0, sub2 = d.sub_away || 0;
                const isTB = (sub1 === 6 && sub2 === 6);
                let pt1 = isTB ? (d.pts_home || 0) : (tennisPoints[d.pts_home] || "0");
                let pt2 = isTB ? (d.pts_away || 0) : (tennisPoints[d.pts_away] || "0");
                subDisplay.innerText = `${t.games}: ${sub1}:${sub2} | Pts: ${pt1}:${pt2}`;
                subDisplay.style.display = 'block';
            } else {
                subDisplay.style.display = 'none';
            }

            // Penalties Display
            let penDisplay = document.getElementById('adm-pen-display');
            if (d.pen_home > 0 || d.pen_away > 0 || config.periods[pIdx].id === 'pen') {
                penDisplay.innerText = `${t.pens}: (${d.pen_home||0}) - (${d.pen_away||0})`;
                penDisplay.style.display = 'block';
            } else {
                penDisplay.style.display = 'none';
            }
            
            // Build Controls Dynamically based on Multi-Sport Logic
            const ctrl = document.getElementById('adm-sport-controls'); 
            let ctrlHtml = `
                <div class="score-ctrl-grid mb-3">
                    <div class="team-ctrl-card">
                        <div class="team-ctrl-lbl">${d.t1 || t.team1}</div>
                        <div class="ctrl-btn-group" id="ctrl-grp-1"></div>
                    </div>
                    <div class="team-ctrl-card">
                        <div class="team-ctrl-lbl">${d.t2 || t.team2}</div>
                        <div class="ctrl-btn-group" id="ctrl-grp-2"></div>
                    </div>
                </div>`;
            ctrl.innerHTML = ctrlHtml;

            let grp1 = document.getElementById('ctrl-grp-1');
            let grp2 = document.getElementById('ctrl-grp-2');
            
            let dis = isLive ? "" : "disabled";
            let bHtml = "";

            if (d.sport === "KOŠARKA") {
                bHtml = `
                    <button class="btn-ctrl minus" onclick="modifyScoreFb('TEAM', -1)" ${dis}>-1</button>
                    <button class="btn-ctrl plus" onclick="modifyScoreFb('TEAM', 1)" ${dis}>+1</button>
                    <button class="btn-ctrl plus" onclick="modifyScoreFb('TEAM', 2)" ${dis}>+2</button>
                    <button class="btn-ctrl plus" onclick="modifyScoreFb('TEAM', 3)" ${dis}>+3</button>
                `;
            } else if (d.sport === "ODBOJKA") {
                bHtml = `
                    <button class="btn-ctrl minus" onclick="modifyVBPointFb('TEAM', -1)" ${dis}>-1</button>
                    <button class="btn-ctrl plus" onclick="modifyVBPointFb('TEAM', 1)" ${dis}>+1 Pt</button>
                `;
            } else if (d.sport === "TENIS") {
                bHtml = `
                    <button class="btn-ctrl minus" onclick="modifyTennisPointFb('TEAM', -1)" ${dis}>-1</button>
                    <button class="btn-ctrl plus" onclick="modifyTennisPointFb('TEAM', 1)" ${dis}>+1 Pt</button>
                `;
            } else { // Fudbal & Rukomet
                bHtml = `
                    <button class="btn-ctrl minus" onclick="modifyScoreFb('TEAM', -1)" ${dis}>-1</button>
                    <button class="btn-ctrl plus" onclick="modifyScoreFb('TEAM', 1)" ${dis}>+1 Goal</button>
                `;
            }

            grp1.innerHTML = bHtml.replace(/TEAM/g, '1');
            grp2.innerHTML = bHtml.replace(/TEAM/g, '2');

            // Events (Football only)
            if (config.hasEvents) {
                let evForm = `
                    <div class="glass-panel" style="padding: 16px;">
                        <input type="text" id="event-player" placeholder="${t.player}" class="mb-2" ${dis}>
                        <select id="event-team" class="mb-3" ${dis}>
                            <option value="1">${d.t1 || t.team1}</option>
                            <option value="2">${d.t2 || t.team2}</option>
                        </select>
                        <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px;">
                            <button onclick="addEventFb('⚽', 'goal')" class="btn-secondary" style="font-size:14px!important; padding:12px;" ${dis}>⚽ ${t.goal}</button>
                            <button onclick="addEventFb('🟨', 'yellow')" class="btn-secondary" style="font-size:14px!important; padding:12px; color:#ffcc00; border-color:rgba(255,204,0,0.3);" ${dis}>🟨 ${t.yellow}</button>
                            <button onclick="addEventFb('🟥', 'red')" class="btn-secondary" style="font-size:14px!important; padding:12px; color:var(--danger); border-color:rgba(255,59,48,0.3);" ${dis}>🟥 ${t.red}</button>
                        </div>
                    </div>
                `;
                ctrl.innerHTML += evForm;
            }

            // Render Event List
            const evMgr = document.getElementById('adm-events-manager'); evMgr.innerHTML = "";
            if(d.events && config.hasEvents) {
                Object.keys(d.events).forEach(ekey => {
                    const ev = d.events[ekey];
                    evMgr.innerHTML += `
                        <div class="adm-event-item">
                            <span>${ev.emoji} ${ev.player}</span>
                            <div class="adm-event-remove" onclick="removeEventFb('${ekey}')" ${dis ? "style='opacity:0.3; pointer-events:none;'" : ""}>&times;</div>
                        </div>`;
                });
            }

            if(d.t1) { 
                document.getElementById('adm-score-view').style.display = 'flex'; 
                document.getElementById('match-setup').style.display = 'none'; 
                document.getElementById('start-live-btn').style.display = d.status==='upcoming' ? 'flex' : 'none'; 
                document.getElementById('end-match-btn').style.display = d.status==='live' ? 'flex' : 'none'; 
                document.getElementById('reset-match-btn').style.display = d.status==='ended' ? 'flex' : 'none'; 
                document.getElementById('btn-next-period').disabled = !isLive;
            } else { 
                document.getElementById('adm-score-view').style.display = 'none'; 
                document.getElementById('match-setup').style.display = 'flex'; 
            }
        }

        // ====== UNIFIED SCORING LOGIC ======

        function modifyScoreFb(team, amount) {
            const d = allTereni.find(x => x.key === currentAdminKey);
            if (!d || d.status !== 'live') return;
            const pId = sportsConfig[d.sport].periods[d.periodIdx || 0].id;
            let updates = {};

            if (pId === 'pen') {
                const f = team === 1 ? 'pen_home' : 'pen_away';
                updates[f] = Math.max(0, (d[f] || 0) + amount);
            } else {
                const f = team === 1 ? 'score1' : 'score2';
                updates[f] = Math.max(0, (d[f] || 0) + amount);
            }
            db.ref(`tereni/${currentAdminKey}`).update(updates);
        }

        function modifyVBPointFb(team, amount) {
            const d = allTereni.find(x => x.key === currentAdminKey);
            if (!d || d.status !== 'live') return;
            
            const myF = team === 1 ? 'sub_home' : 'sub_away';
            const opF = team === 1 ? 'sub_away' : 'sub_home';
            const scF = team === 1 ? 'score1' : 'score2';
            
            let myPts = d[myF] || 0;
            let opPts = d[opF] || 0;
            let mySets = d[scF] || 0;
            
            if (amount === -1) {
                myPts = Math.max(0, myPts - 1);
                db.ref(`tereni/${currentAdminKey}`).update({ [myF]: myPts });
                return;
            }
            
            myPts++;
            // periodIdx 5 = Set 5
            const target = (d.periodIdx === 5) ? 15 : 25;
            
            let updates = {};
            if (myPts >= target && (myPts - opPts >= 2)) {
                // Set won
                updates[scF] = mySets + 1;
                // Auto advance period
                updates.periodIdx = Math.min((d.periodIdx || 0) + 1, sportsConfig[d.sport].periods.length - 1);
                // Reset points
                updates.sub_home = 0;
                updates.sub_away = 0;
                
                if (updates[scF] === 3) updates.status = 'ended';
            } else {
                updates[myF] = myPts;
            }
            db.ref(`tereni/${currentAdminKey}`).update(updates);
        }

        function modifyTennisPointFb(team, amount) {
            const d = allTereni.find(x => x.key === currentAdminKey);
            if (!d || d.status !== 'live') return;

            const myPtsF = team === 1 ? 'pts_home' : 'pts_away';
            const opPtsF = team === 1 ? 'pts_away' : 'pts_home';
            const myGmF = team === 1 ? 'sub_home' : 'sub_away';
            const opGmF = team === 1 ? 'sub_away' : 'sub_home';
            const mySetF = team === 1 ? 'score1' : 'score2';

            let myPts = d[myPtsF] || 0, opPts = d[opPtsF] || 0;
            let myGms = d[myGmF] || 0, opGms = d[opGmF] || 0;
            let mySets = d[mySetF] || 0;

            const isTB = (myGms === 6 && opGms === 6);
            let updates = {};

            if (amount === -1) {
                if (isTB) myPts = Math.max(0, myPts - 1);
                else if (myPts > 0) myPts--;
                updates[myPtsF] = myPts;
                db.ref(`tereni/${currentAdminKey}`).update(updates);
                return;
            }

            if (isTB) {
                myPts++;
                if (myPts >= 7 && (myPts - opPts >= 2)) {
                    updates[mySetF] = mySets + 1;
                    updates.periodIdx = Math.min((d.periodIdx || 0) + 1, sportsConfig[d.sport].periods.length - 1);
                    updates.pts_home = 0; updates.pts_away = 0;
                    updates.sub_home = 0; updates.sub_away = 0;
                    if (updates[mySetF] === 3) updates.status = 'ended';
                } else {
                    updates[myPtsF] = myPts;
                }
            } else {
                if (myPts < 3) myPts++;
                else if (myPts === 3) {
                    if (opPts < 3) { // Game won
                        myGms++; myPts = 0; opPts = 0;
                    } else if (opPts === 3) { myPts = 4; } // AD
                    else if (opPts === 4) { opPts = 3; } // Deuce
                } else if (myPts === 4) {
                    myGms++; myPts = 0; opPts = 0;
                }
                
                if (myGms >= 6 && (myGms - opGms >= 2)) {
                    updates[mySetF] = mySets + 1;
                    updates.periodIdx = Math.min((d.periodIdx || 0) + 1, sportsConfig[d.sport].periods.length - 1);
                    updates.pts_home = 0; updates.pts_away = 0;
                    updates.sub_home = 0; updates.sub_away = 0;
                    if (updates[mySetF] === 3) updates.status = 'ended';
                } else {
                    updates[myPtsF] = myPts; updates[opPtsF] = opPts;
                    updates[myGmF] = myGms; updates[opGmF] = opGms;
                }
            }
            db.ref(`tereni/${currentAdminKey}`).update(updates);
        }

        // PERIOD ADVANCE
        function advancePeriodFb() {
            const d = allTereni.find(x => x.key === currentAdminKey);
            if (!d || d.status !== 'live') return;
            let nextIdx = (d.periodIdx || 0) + 1;
            if (nextIdx >= sportsConfig[d.sport].periods.length) return;
            
            let updates = { periodIdx: nextIdx };
            if (sportsConfig[d.sport].periods[nextIdx].id === 'end') {
                updates.status = 'ended';
                // Penality winner logic for FB/HB
                if (d.pen_home > d.pen_away) updates.score1 = (d.score1 || 0) + 1;
                else if (d.pen_away > d.pen_home) updates.score2 = (d.score2 || 0) + 1;
            } else if (d.sport === 'ODBOJKA' || d.sport === 'TENIS') {
                updates.sub_home = 0; updates.sub_away = 0;
                updates.pts_home = 0; updates.pts_away = 0;
            }
            
            db.ref(`tereni/${currentAdminKey}`).update(updates);
        }

        function endMatchFb() {
            const d = allTereni.find(x => x.key === currentAdminKey);
            if (!d) return;
            let updates = { status: 'ended', periodIdx: sportsConfig[d.sport].periods.length - 1 };
            // Auto add shootout winner
            if (d.pen_home > d.pen_away) updates.score1 = (d.score1 || 0) + 1;
            else if (d.pen_away > d.pen_home) updates.score2 = (d.score2 || 0) + 1;
            db.ref(`tereni/${currentAdminKey}`).update(updates);
        }

        // EVENTS
        function addEventFb(emoji, type) { 
            const d = allTereni.find(x => x.key === currentAdminKey);
            if(!d || d.status !== 'live') return;
            const p = document.getElementById('event-player').value.toUpperCase(), t = parseInt(document.getElementById('event-team').value); 
            if(!p) return; 
            
            const evRef = db.ref(`tereni/${currentAdminKey}/events`).push();
            evRef.set({ player: p, team: t, emoji: emoji, type: type }); 
            
            if (type === 'goal') modifyScoreFb(t, 1);
            document.getElementById('event-player').value = ""; 
        }
        
        function removeEventFb(ekey) { 
            const d = allTereni.find(x => x.key === currentAdminKey);
            if(!d || d.status !== 'live' || !ekey) return; 
            const ev = d.events[ekey];
            if(confirm(translations[currentLang].confirmDelete)) { 
                db.ref(`tereni/${currentAdminKey}/events/${ekey}`).remove(); 
                if (ev.type === 'goal') modifyScoreFb(ev.team, -1);
            } 
        }

        // SETUP MATCH
        async function setupMatch() { 
            let l = document.getElementById('adm-league-input').value.toUpperCase(), 
                t1 = document.getElementById('adm-t1').value.toUpperCase().substring(0, 10), 
                t2 = document.getElementById('adm-t2').value.toUpperCase().substring(0, 10), 
                time = document.getElementById('adm-time').value; 
            if(!t1 || !t2) return; 
            saveSuggestion('leagues', l); saveSuggestion('teams', t1); saveSuggestion('teams', t2); 
            await db.ref(`tereni/${currentAdminKey}`).update({ 
                league: l, t1, t2, match_time: time, status: 'upcoming', 
                score1: 0, score2: 0, 
                sub_home: 0, sub_away: 0, 
                pts_home: 0, pts_away: 0,
                pen_home: 0, pen_away: 0,
                periodIdx: 0, minute: 0,
                events: null
            }); 
        }
        
        function closeDetails() { document.getElementById('match-details-view').classList.remove('active'); }
        
        function trackGPS() { 
            if(!navigator.geolocation) return; 
            navigator.geolocation.watchPosition(pos => { 
                currentLat = pos.coords.latitude; currentLon = pos.coords.longitude; 
                if(!userMarker) { 
                    userMarker = L.marker([currentLat, currentLon], { icon: L.divIcon({ className: 'user-location-dot', iconSize: [16, 16] }) }).addTo(map); 
                } else {
                    userMarker.setLatLng([currentLat, currentLon]); 
                }
            }, null, { enableHighAccuracy: true }); 
        }
        
        function goToMyLocation() { if(currentLat) map.flyTo([currentLat, currentLon], 18); }
        
        function handleSearch(e) { 
            if(e.key === "Enter") { 
                fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${e.target.value}`)
                .then(r => r.json()).then(data => { 
                    if(data[0]) { map.flyTo([data[0].lat, data[0].lon], 15); toggleSearch(); } 
                }); 
            } 
        }
        
        async function handleAuth() { 
            let e = document.getElementById('email').value, p = document.getElementById('password').value; 
            try { 
                await auth.signInWithEmailAndPassword(e, p); 
            } catch { 
                try { 
                    await auth.createUserWithEmailAndPassword(e, p); 
                } catch(err) { 
                    alert(err.message); 
                } 
            } 
        }

        async function saveTeren(lat, lng) { 
            const n = document.getElementById('p_name').value.toUpperCase();
            const myCourts = allTereni.filter(t => t.owner === auth.currentUser.uid);
            if (myCourts.length >= 3) { alert(translations[currentLang].limitReached); return; }
            await db.ref('tereni').push({ 
                name: n, lat, lng, owner: auth.currentUser.uid, 
                sport: document.getElementById('p_sport').value, 
                status: 'upcoming', score1: 0, score2: 0,
                sub_home: 0, sub_away: 0, pts_home: 0, pts_away: 0, pen_home: 0, pen_away: 0, periodIdx: 0
            }); 
            map.closePopup(); 
        }
        
        function adminStatus(s) { db.ref(`tereni/${currentAdminKey}`).update({ status: s }); }
        
        function adminDelete() { 
            if(confirm(translations[currentLang].confirmDelete)) { 
                db.ref(`tereni/${currentAdminKey}`).remove(); closeAdmin(); 
            } 
        }
        
        function resetMatch() { 
            db.ref(`tereni/${currentAdminKey}`).update({ 
                t1: null, t2: null, status: 'upcoming', 
                score1: 0, score2: 0, 
                sub_home: 0, sub_away: 0, pts_home: 0, pts_away: 0, pen_home: 0, pen_away: 0,
                periodIdx: 0, events: null 
            }); 
        }
        
        function toggleSearch() { 
            document.getElementById('search-container').classList.toggle('expanded'); 
            if(document.getElementById('search-container').classList.contains('expanded')) document.getElementById('city-search').focus(); 
        }
    </script>
</body>
</html>
