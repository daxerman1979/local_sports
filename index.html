<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover">
    <title>SCOREPUNKT</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="manifest" href="manifest.json">
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      }
    </script>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700;900&family=Inter:wght@400;500;600;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #ccff00; 
            --primary-glow: rgba(204, 255, 0, 0.4);
            --bg-dark: #09090b;
            --glass-bg: rgba(15, 15, 20, 0.95); 
            --glass-border: rgba(255, 255, 255, 0.1);
            --danger: #ff2a2a; 
            --danger-glow: rgba(255, 42, 42, 0.4);
            --text-main: #ffffff;
            --text-muted: #a1a1aa;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: pan-x pan-y; margin: 0; padding: 0; }
        html, body { height: 100%; width: 100%; overflow: hidden; background: var(--bg-dark); font-family: 'Inter', sans-serif; position: fixed; color: var(--text-main); }

        .glass-panel { background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 24px; box-shadow: 0 15px 40px rgba(0, 0, 0, 0.8); }

        input, select, textarea, datalist { 
            font-size: 15px !important; outline: none !important; text-transform: uppercase; 
            background: #111; color: white; border: 1px solid var(--glass-border); 
            padding: 16px; border-radius: 14px; font-family: 'Inter', sans-serif; width: 100%;
            transition: border-color 0.2s; -webkit-appearance: none;
        }
        input:focus, select:focus { border-color: var(--primary); background: #1a1a10; }
        
        button { font-family: 'Inter', sans-serif; font-size: 16px !important; outline: none !important; border-radius: 14px; display: flex; justify-content: center; align-items: center; gap: 8px; cursor: pointer; transition: transform 0.1s; will-change: transform; }
        button:active { transform: scale(0.96); }
        button:disabled { opacity: 0.5; pointer-events: none; }

        .btn-primary { background: var(--primary); color: #000; border: none; padding: 18px; font-weight: 900; text-transform: uppercase; font-family: 'Oswald', sans-serif; letter-spacing: 0.5px; }
        .btn-secondary { background: #222; border: 1px solid var(--glass-border); color: var(--text-main); padding: 16px; font-weight: 700; }

        .mb-2 { margin-bottom: 8px; } .mb-3 { margin-bottom: 12px; } .mt-3 { margin-top: 12px; } .w-full { width: 100%; }
        
        /* ---------------- Ostali UI i mapa ---------------- */
        #map { width: 100vw; height: 100vh; background: var(--bg-dark); display: block; }
        
        /* RADAR ANIMACIJA - Samo linija bez ispunjenja */
        .radar-wave-circle { 
            transform-origin: center; 
            transform-box: fill-box;
            animation: sonar-wave 3s cubic-bezier(0.1, 0, 0.3, 1) infinite; 
            will-change: transform, stroke-opacity; 
        }
        @keyframes sonar-wave { 
            0% { transform: scale(0); stroke-opacity: 1; fill: none; } 
            100% { transform: scale(1); stroke-opacity: 0; fill: none; } 
        }

        #search-container { position: absolute; top: 20px; left: 20px; z-index: 5000; display: flex; align-items: center; transition: all 0.3s; width: 48px; height: 48px; background: var(--glass-bg); border-radius: 24px; border: 1px solid var(--glass-border); overflow: hidden; will-change: width; }
        #search-container.expanded { width: calc(100% - 90px); border-color: var(--primary); background: #111; }
        #city-search { width: 100%; border: none; background: transparent; color: white; padding: 12px 60px 12px 48px; opacity: 0; pointer-events: none; }
        #search-container.expanded #city-search { opacity: 1; pointer-events: all; }
        .search-icon { position: absolute; left: 14px; width: 20px; height: 20px; filter: brightness(0) invert(1); cursor: pointer; z-index: 5001; }
        .search-go-btn { position: absolute; right: 5px; top: 5px; bottom: 5px; background: var(--primary); color: #000; border: none; border-radius: 20px; padding: 0 14px; font-weight: 900; font-size: 12px !important; opacity: 0; pointer-events: none; }
        #search-container.expanded .search-go-btn { opacity: 1; pointer-events: all; }

        #info-toast { position: fixed; top: 80px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: white; font-size: 11px; font-weight: 700; padding: 8px 16px; border-radius: 20px; z-index: 4500; pointer-events: none; transition: opacity 0.3s ease; will-change: opacity; }

        .floating-action-btn { position: absolute; right: 20px; z-index: 5500; display: flex; justify-content: center; align-items: center; border-radius: 50%; background: #111; border: 1px solid var(--glass-border); cursor: pointer; }
        .location-btn { bottom: 20px; width: 40px; height: 40px; } .location-btn img { filter: brightness(0) invert(1); width: 18px; }
        .back-btn { top: 20px; width: 48px; height: 48px; font-weight: bold; font-size: 18px; }

        #login-widget { position: absolute; bottom: 20px; left: 20px; width: calc(100% - 80px); max-width: 300px; z-index: 5500; display: none; flex-direction: column; transition: transform 0.3s; will-change: transform; background: #111; border: 1px solid var(--glass-border); border-radius: 24px; }
        #login-widget.collapsed { transform: translateY(calc(100% - 52px)); }
        .login-header-tab { height: 52px; padding: 0 16px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; background: #1a1a1a; border-radius: 24px 24px 0 0; }
        #login-widget.collapsed .login-header-tab { border-radius: 24px; }
        .login-content { padding: 16px; display: flex; flex-direction: column; gap: 12px; }

        .lang-dropdown-container { position: relative; display: inline-block; cursor: pointer; user-select: none; }
        .current-lang { display: flex; align-items: center; gap: 6px; background: #222; border: 1px solid var(--glass-border); padding: 6px 10px; border-radius: 8px; font-size: 11px; font-weight: 800; color: white; }
        .lang-list { position: absolute; bottom: 100%; right: 0; margin-bottom: 8px; background: #111; border: 1px solid var(--glass-border); border-radius: 8px; display: none; flex-direction: column; z-index: 1000; min-width: 70px; }
        .lang-dropdown-container.open .lang-list { display: flex; }
        .lang-option { padding: 10px; font-size: 11px; font-weight: 800; color: white; text-align: center; }

        /* ---------------- MARKERI I TOOLTIPI ---------------- */
        .sport-marker-wrapper { display: flex; flex-direction: column; align-items: center; position: relative; }
        .marker-content-box { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; pointer-events: none; z-index: 30;}
        .marker-content-box > * { pointer-events: auto; }

        .marker-ball-only { font-size: 11px; filter: drop-shadow(0 2px 3px rgba(0,0,0,0.5)); display: block; background: #111; padding: 4px; border-radius: 50%; border: 1px solid var(--glass-border); cursor: pointer; }
        .zoom-near .marker-ball-only { display: none; }
        .status-live-wrapper .marker-ball-only { border-color: var(--primary); background: #222; }

        .hover-tooltip { position: absolute; bottom: 120%; left: 50%; transform: translateX(-50%); background: #111; border: 1px solid var(--primary); color: white; padding: 4px 10px; border-radius: 6px; font-size: 10px; font-weight: 800; white-space: nowrap; opacity: 0; pointer-events: none; font-family: 'Oswald', sans-serif; }
        .zoom-near .hover-tooltip { display: none !important; }
        .marker-ball-only:hover .hover-tooltip { opacity: 1; transform: translateX(-50%) translateY(-3px); }

        .tv-card-wrapper { display: none; flex-direction: column; align-items: center; z-index: 25; width: max-content; }
        .zoom-near .tv-card-wrapper { display: flex; }
        .tv-card { background: #111; border-radius: 8px; display: flex; flex-direction: column; color: white; box-shadow: 0 15px 35px rgba(0,0,0,0.9); border: 1px solid var(--glass-border); overflow: hidden; min-width: 180px; width: 100%; }
        .tv-live { border-top: 3px solid var(--danger); }
        
        .tv-league { background: #1a1a1a; color: var(--text-muted); font-size: 10px; font-weight: 800; padding: 4px 10px; text-transform: uppercase; letter-spacing: 1px; }
        .tv-live .tv-league { background: rgba(255,42,42,0.15); color: var(--danger); }
        
        .tv-team-row { display: flex; align-items: stretch; border-bottom: 1px solid rgba(255,255,255,0.05); background: #050505; }
        .tv-team-name { flex: 1; padding: 6px 10px; color: white; font-weight: 800; font-size: 14px; font-family: 'Oswald', sans-serif; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; min-width: 70px; }
        .tv-team-score, .tv-period-score, .tv-curr-score { flex-shrink: 0; display: flex; justify-content: center; align-items: center; border-left: 1px solid rgba(255,255,255,0.05); }
        .tv-team-score { width: 40px; background: #000; padding: 6px 0; font-size: 16px; font-weight: 900; color: white; font-family: 'Oswald', sans-serif; }
        .tv-live .tv-team-score { color: var(--primary); }
        .tv-period-score { width: 32px; padding: 6px 0; font-size: 14px; font-weight: 700; color: var(--text-muted); }
        .tv-curr-score { width: 42px; padding: 6px 0; font-size: 14px; font-weight: 900; color: #ff9500; background: rgba(255, 149, 0, 0.1); }
        .tv-bottom-bar { background: #000; padding: 5px 10px; display: flex; justify-content: space-between; font-size: 11px; font-weight: 700; color: var(--text-muted); }

        .tv-card-details { background: #111; border: 1px solid var(--glass-border); border-top: none; border-radius: 0 0 8px 8px; width: 96%; padding: 12px; display: none; flex-direction: column; gap: 8px; margin-top: -1px; font-family: 'Inter', sans-serif; }
        .marker-pointer { width: 0; height: 0; border-left: 12px solid transparent; border-right: 12px solid transparent; border-top: 14px solid var(--text-main); display: none; margin-top: 2px; }
        .zoom-near .marker-pointer { display: block; }
        .status-live-wrapper .marker-pointer { border-top-color: var(--danger); }

        /* -------------- ADMIN PANEL -------------- */
        #admin-panel { position: fixed; top: 0; left: 100%; width: 100%; height: 100%; background: var(--bg-dark); z-index: 9000; transition: left 0.3s; display: flex; flex-direction: column; overflow-y: auto; will-change: left; }
        #admin-panel.active { left: 0; }

        .admin-header { padding: 20px 24px; background: #111; border-bottom: 1px solid var(--glass-border); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 10; }
        .admin-content-scroll { padding: 24px; display: flex; flex-direction: column; gap: 16px; flex-grow: 1; }

        .admin-score-hero { background: #111; border: 1px solid var(--primary); padding: 30px 20px; text-align: center; border-radius: 20px; transition: 0.3s; }
        @keyframes pulse-score { 0% { transform: scale(1); } 50% { transform: scale(1.05); border-color: #fff; } 100% { transform: scale(1); } }
        .anim-score { animation: pulse-score 0.4s ease-out; }

        .score-ctrl-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .team-ctrl-card { background: #111; border: 1px solid var(--glass-border); border-radius: 16px; padding: 16px; text-align: center; }
        .team-ctrl-lbl { font-size: 13px; color: var(--text-muted); font-weight: 800; text-transform: uppercase; margin-bottom: 12px; }
        .ctrl-btn-group { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
        .btn-ctrl { width: 50px; height: 50px; border-radius: 12px; font-size: 24px !important; font-family: 'Oswald', sans-serif; display: flex; justify-content: center; align-items: center; border: none; cursor: pointer; }
        .btn-ctrl.minus { background: #333; color: white; }
        .btn-ctrl.plus { background: var(--primary); color: #000; font-weight: bold; }

        .adm-event-list { display: flex; flex-direction: column; gap: 8px; max-height: 250px; overflow-y: auto; }
        .adm-event-item { background: #000; padding: 12px 16px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--glass-border); border-left: 3px solid var(--primary); }
        .adm-event-item span { font-size: 14px; font-weight: 700; color: #fff; text-transform: uppercase; }
        .adm-event-remove { color: var(--danger); font-size: 22px; cursor: pointer; width: 32px; height: 32px; display: flex; justify-content: center; align-items: center; background: rgba(255,42,42,0.1); border-radius: 8px; }

        .user-location-dot { background: #0a84ff; width: 16px; height: 16px; border: 3px solid white; border-radius: 50%; box-shadow: 0 0 15px #0a84ff; }
        
        @media (min-width: 768px) {
            #admin-panel { width: 450px; left: auto; right: -450px; border-left: 1px solid var(--glass-border); transition: right 0.3s; will-change: right; }
            #admin-panel.active { right: 0; left: auto; }
            #search-container.expanded { width: 350px; }
        }

        .leaflet-popup-content-wrapper { background: #111; color: white; border-radius: 24px; border: 1px solid var(--glass-border); padding: 5px; box-shadow: 0 15px 30px rgba(0,0,0,0.9) !important; }
        .leaflet-popup-tip { background: #111; border: 1px solid var(--glass-border); }
        .leaflet-popup-content { margin: 15px; min-width: 240px !important; }
        .leaflet-popup-close-button { color: var(--text-muted) !important; font-size: 28px !important; padding: 10px !important; }

        /* -------------- CUSTOM APP MODAL (ZAMJENA ZA ALERT/CONFIRM) -------------- */
        #custom-modal-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.7); backdrop-filter: blur(5px);
            display: flex; justify-content: center; align-items: center; z-index: 9999;
            opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        #custom-modal-overlay.show { opacity: 1; pointer-events: auto; }
        .app-modal {
            background: var(--glass-bg); border: 1px solid var(--glass-border);
            border-radius: 20px; padding: 24px; width: 85%; max-width: 340px;
            text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.9);
            transform: scale(0.9); transition: transform 0.3s;
        }
        #custom-modal-overlay.show .app-modal { transform: scale(1); }
        .modal-text { color: white; font-size: 15px; font-weight: 600; margin-bottom: 24px; font-family: 'Inter', sans-serif; line-height: 1.4; }
        .modal-btn-row { display: flex; gap: 12px; justify-content: center; }
        .modal-btn-row button { flex: 1; padding: 14px; font-size: 14px !important; }
    </style>
</head>
<body>

    <div id="map"></div>
    
    <!-- Custom Modal umjesto standardnih pregledničkih upozorenja -->
    <div id="custom-modal-overlay">
        <div class="app-modal">
            <div class="modal-text" id="modal-msg"></div>
            <div class="modal-btn-row">
                <button class="btn-secondary" id="modal-cancel-btn" onclick="closeAppModal()" style="display:none; color: white;">NE</button>
                <button class="btn-primary" id="modal-ok-btn" onclick="confirmAppModal()" style="font-family:'Oswald', sans-serif;">DA</button>
            </div>
        </div>
    </div>

    <div id="ui-controls">
        <div id="info-toast">ZOOM IN TO REVEAL (MATCHES WITHIN 30KM)</div>

        <div id="search-container">
            <img src="https://cdn-icons-png.flaticon.com/512/622/622669.png" class="search-icon" onclick="toggleSearch()" alt="Search">
            <input type="text" id="city-search" placeholder="Pretraži..." onkeypress="handleSearch(event)">
            <button class="search-go-btn" onclick="executeSearch()">GO</button>
        </div>
        
        <div class="floating-action-btn back-btn" onclick="goBackToLogin()" id="btn-back-icon" style="display:none;"></div>
        
        <div class="floating-action-btn location-btn" onclick="goToMyLocation()">
            <img src="https://cdn-icons-png.flaticon.com/512/1865/1865269.png" alt="Location">
        </div>
        
        <div id="user-indicator" style="display:none; position:fixed; bottom:20px; left:20px; color:var(--primary); font-size:11px; font-weight:800; z-index:5000; background: #111; padding: 10px 16px; border-radius: 20px; border: 1px solid var(--glass-border);"></div>
        
        <div id="login-widget" class="collapsed">
            <div class="login-header-tab" onclick="toggleLoginWidget()">
                <div style="display:flex; align-items:center; gap: 8px;">
                    <h3 style="margin:0; font-family:'Oswald'; color:var(--primary); font-size:18px; letter-spacing:1px;">SCORE<span style="color:white;">PUNKT</span></h3>
                </div>
                
                <div id="lang-dropdown" class="lang-dropdown-container" onclick="toggleLangDropdown(event)">
                    <div class="current-lang" style="padding: 4px 8px; font-size: 10px;">
                        <span id="current-lang-text">ENG</span>
                        <span class="arrow">▲</span>
                    </div>
                    <div class="lang-list">
                        <div class="lang-option" onclick="setLanguage('en'); toggleLangDropdown(event);">ENG</div>
                        <div class="lang-option" onclick="setLanguage('sr'); toggleLangDropdown(event);">SRB</div>
                    </div>
                </div>
            </div>
            
            <div class="login-content">
                <input type="email" id="email" placeholder="EMAIL ADDRESS">
                <input type="password" id="password" placeholder="PASSWORD">
                <button class="btn-primary" id="btn-login" onclick="handleAuth()">ULAZ U SISTEM</button>
            </div>
        </div>
    </div>

    <div id="admin-panel">
        <div class="admin-header">
            <div id="adm-name" style="font-family:'Oswald'; font-size:22px; color:#fff; font-weight:700; text-transform:uppercase;">ADMIN TABLA</div>
            <div onclick="closeAdmin()" style="font-size:32px; color:var(--text-muted); cursor:pointer; line-height:1;">&times;</div>
        </div>
        
        <div class="admin-content-scroll">
            <div id="adm-score-view" style="display:none; flex-direction:column;">
                <div class="admin-score-hero mb-3" id="admin-score-container">
                    <div id="adm-main-score" style="font-size:64px; font-family:'Oswald'; font-weight:900; color:var(--primary); line-height:1.1;">0 : 0</div>
                    <div id="adm-sub-display" style="color:var(--text-main); font-weight:800; font-family:'Oswald'; margin-top:12px; letter-spacing:1px; font-size: 14px;"></div>
                </div>
                
                <div id="adm-sport-controls"></div>
                <div id="adm-events-manager" class="adm-event-list mt-3"></div>
                
                <div style="display:flex; flex-direction:column; gap:12px; margin-top:10px;">
                    <button class="btn-secondary" style="border-color: rgba(204,255,0,0.4); color:var(--primary);" onclick="triggerLogic('period')" id="btn-save-period">SAČUVAJ PERIOD / SET</button>
                    <button id="start-live-btn" class="btn-primary" onclick="adminStatus('live')">KRENI UŽIVO</button>
                    <button id="end-match-btn" class="btn-primary" style="background:var(--danger); color:white; display:none;" onclick="triggerLogic('end')">ZAVRŠI MEČ</button>
                    <button id="reset-match-btn" class="btn-secondary" style="display:none;" onclick="resetMatch()">RESET / NOVI MEČ</button>
                </div>
            </div>

            <div id="match-setup" style="display:none; flex-direction:column; gap:16px;">
                <div class="glass-panel" style="padding: 24px; display:flex; flex-direction:column; gap:16px;">
                    <h3 style="font-family:'Oswald'; color:white; margin-bottom: 8px;">ZAKAZIVANJE</h3>
                    <input type="text" id="adm-league-input" placeholder="LIGA (NOVA)" list="league-list">
                    <datalist id="league-list"></datalist>
                    
                    <div style="display:flex; gap:12px;">
                        <input type="text" id="adm-t1" placeholder="TIM 1 (MAX 10)" maxlength="10" list="team-list">
                        <input type="text" id="adm-t2" placeholder="TIM 2 (MAX 10)" maxlength="10" list="team-list">
                    </div>
                    <datalist id="team-list"></datalist>
                    
                    <input type="datetime-local" id="adm-time">
                    <button class="btn-primary mt-3" onclick="setupMatch()" id="btn-schedule">ZAKAŽI MEČ</button>
                </div>
            </div>
            
            <button class="btn-secondary" style="margin-top:auto; color: var(--danger); border-color: rgba(255,42,42,0.2);" onclick="adminDelete()" id="btn-delete-court">OBRIŠI TEREN</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        const firebaseConfig = {

        let currentLang = localStorage.getItem('lang') || 'en';

        const tennisPoints = ["0", "15", "30", "40", "AD"];

        const translations = {

        // Custom Modal Logic
        let modalConfirmCallback = null;

            document.getElementById('modal-ok-btn').innerText = 'OK';

            document.getElementById('modal-ok-btn').style.color = '#000';
            document.getElementById('custom-modal-overlay').classList.add('show');
            modalConfirmCallback = null;
        }
        function showAppConfirm(msg, callback, isDanger = false) {
            document.getElementById('modal-msg').innerText = msg;

            document.getElementById('modal-ok-btn').innerText = currentLang === 'en' ? 'YES' : 'DA';
            document.getElementById('modal-cancel-btn').innerText = currentLang === 'en' ? 'NO' : 'NE';

                document.getElementById('modal-ok-btn').style.color = '#000';
            }

        function loadSuggestions() { 
            db.ref('suggestions/leagues').on('value', snap => { 
                let dl = document.getElementById('league-list'); dl.innerHTML = ""; 
                snap.forEach(s => dl.innerHTML += `<option value="${s.val()}">`); 
            }); 
            db.ref('suggestions/teams').on('value', snap => { 
                let dl = document.getElementById('team-list'); dl.innerHTML = ""; 
                snap.forEach(s => dl.innerHTML += `<option value="${s.val()}">`); 
            }); 
        }
        
        function saveSuggestion(type, value) { 
            if(!value) return; const ref = db.ref(`suggestions/${type}`); 
            ref.once('value', snap => { let ex = false; snap.forEach(s => { if(s.val() === value) ex = true; }); if(!ex) ref.push(value); }); 
        }

        function initMap() {
            if (map) return;
            const sLat = localStorage.getItem('lastLat') || 44.7866, sLng = localStorage.getItem('lastLng') || 20.4489, sZoom = localStorage.getItem('lastZoom') || 13;
            
            map = L.map('map', { zoomControl: false, tap: false, minZoom: 3 }).setView([sLat, sLng], sZoom);
            
            L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { noWrap: true }).addTo(map);
            L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', { opacity: 0.8, noWrap: true }).addTo(map);

            rangeCircleWave = L.circle(map.getCenter(), { radius: 30000, color: 'var(--primary)', weight: 2.5, fill: false, interactive: false, className: 'radar-wave-circle' }).addTo(map);

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(pos => { map.setView([pos.coords.latitude, pos.coords.longitude], 15); }, () => {}, { timeout: 5000 });
            }

            map.on('move', () => { 
                rangeCircleWave.setLatLng(map.getCenter());
            });

            map.on('moveend', () => { 
                let c = map.getCenter(); localStorage.setItem('lastLat', c.lat); localStorage.setItem('lastLng', c.lng); localStorage.setItem('lastZoom', map.getZoom()); 
                
                // UKLANJANJE/DODAVANJE KRUGA ZAVISNO OD ZUMIRANJA
                if (map.getZoom() > 12) {
                    if(map.hasLayer(rangeCircleWave)) map.removeLayer(rangeCircleWave);
                } else {
                    if(!map.hasLayer(rangeCircleWave)) map.addLayer(rangeCircleWave);
                }

                reRenderAllMarkers(); 
            });
            
            map.on('click', handleMapClick);

            db.ref('tereni').on('child_added', snap => { allTereniData[snap.key] = snap.val(); renderSingleMarker(snap.key); });
            db.ref('tereni').on('child_changed', snap => { allTereniData[snap.key] = snap.val(); renderSingleMarker(snap.key); if(currentAdminKey === snap.key) refreshAdminPanel(snap.key); });
            db.ref('tereni').on('child_removed', snap => { delete allTereniData[snap.key]; removeMarker(snap.key); if(currentAdminKey === snap.key) closeAdmin(); });
            
            trackGPS();
        }

        function renderSingleMarker(key) {
            if (!map) return;
            const d = allTereniData[key];
            const center = map.getCenter();
            const zoomNear = map.getZoom() > 12;
            const t = translations[currentLang];

            const infoToast = document.getElementById('info-toast');
            if(infoToast) infoToast.style.opacity = zoomNear ? '0' : '1';

            if (map.distance(center, [d.lat, d.lng]) > 30000) { removeMarker(key); return; }
            
            const isLive = d.status === 'live', isEnded = d.status === 'ended', isUpcoming = d.status === 'upcoming' && d.t1;
            const ball = sportEmojis[d.sport] || '⚽';
            
            let cardBody = "";
            let periodsHtml = "";
            let eventsHtml = "";
            
            if (isLive || isEnded || isUpcoming) {
                let s1 = (isLive || isEnded) ? (d.score1 || 0) : "-";
                let s2 = (isLive || isEnded) ? (d.score2 || 0) : "-";
                let statusText = isLive ? `<span style="color:var(--danger);">● ${t.live}</span>` : (isEnded ? t.ended : new Date(d.match_time).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}));
                
                let p1Html = "", p2Html = "";
                if (d.sub_details) {
                    Object.values(d.sub_details).forEach(v => {
                        let match = v.match(/(\d+):(\d+)$/);
                        p1Html += `<div class="tv-period-score">${match ? match[1] : '-'}</div>`;
                        p2Html += `<div class="tv-period-score">${match ? match[2] : '-'}</div>`;
                    });

                    periodsHtml += `<div style="background:rgba(0,0,0,0.4); border-radius:8px; padding:8px; border: 1px solid var(--glass-border);">`;
                    periodsHtml += `<div style="display:flex; border-bottom:1px solid rgba(255,255,255,0.1); margin-bottom:4px; padding-bottom:4px;"><div style="flex:2; font-size:9px; color:var(--text-muted);">${t.team}</div>`;
                    Object.values(d.sub_details).forEach(v => { periodsHtml += `<div style="flex:1; text-align:center; font-size:9px; color:var(--primary);">${v.split(' ')[0] || '-'}</div>`; });
                    periodsHtml += `</div>`;
                    periodsHtml += `<div style="display:flex; margin-bottom:4px;"><div style="flex:2; font-size:11px; font-weight:800;">${(d.t1 || t.team1).substring(0,8)}</div>`;
                    Object.values(d.sub_details).forEach(v => { let match = v.match(/(\d+):(\d+)$/); periodsHtml += `<div style="flex:1; text-align:center; font-size:11px; font-weight:700;">${match ? match[1] : '-'}</div>`; });
                    periodsHtml += `</div>`;
                    periodsHtml += `<div style="display:flex;"><div style="flex:2; font-size:11px; font-weight:800;">${(d.t2 || t.team2).substring(0,8)}</div>`;
                    Object.values(d.sub_details).forEach(v => { let match = v.match(/(\d+):(\d+)$/); periodsHtml += `<div style="flex:1; text-align:center; font-size:11px; font-weight:700;">${match ? match[2] : '-'}</div>`; });
                    periodsHtml += `</div></div>`;
                }

                if (d.events) {
                    let eH = "", eA = "";
                    Object.values(d.events).forEach(ev => {
                        if(ev.team == 1) eH += `<div style="font-size:11px; margin-bottom:4px; font-weight:600;"><span style="font-size:14px;">${ev.emoji}</span>${ev.player}</div>`;
                        else eA += `<div style="font-size:11px; margin-bottom:4px; text-align:right; font-weight:600;">${ev.player} <span style="font-size:14px;">${ev.emoji}</span></div>`;
                    });
                    eventsHtml = `<div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;"><div>${eH}</div><div>${eA}</div></div>`;
                }

                let curr1 = "", curr2 = "";
                if (isLive && (d.sport === "TENIS" || d.sport === "ODBOJKA")) {
                    const isTB = (d.g1 === 6 && d.g2 === 6);
                    const pt1 = d.sport === "TENIS" ? (isTB ? (d.p1||0) : (tennisPoints[d.p1]||"0")) : (d.p1||0);
                    const pt2 = d.sport === "TENIS" ? (isTB ? (d.p2||0) : (tennisPoints[d.p2]||"0")) : (d.p2||0);
                    
                    if (d.sport === "TENIS") {
                        p1Html += `<div class="tv-period-score" style="color: white;">${d.g1||0}</div>`;
                        p2Html += `<div class="tv-period-score" style="color: white;">${d.g2||0}</div>`;
                    }
                    curr1 = `<div class="tv-curr-score">${pt1}</div>`;
                    curr2 = `<div class="tv-curr-score">${pt2}</div>`;
                }

                const sportName = (t.sports && t.sports[d.sport]) ? t.sports[d.sport] : d.sport;
                let inlineDetails = "";
                if (d.sport === "FUDBAL") {
                    inlineDetails = `<div class="tv-card-details" id="inline-${key}">
                        ${periodsHtml} ${eventsHtml}${!periodsHtml && !eventsHtml ? `<div style="text-align:center; font-size:10px; font-weight:700; color:var(--text-muted); padding: 8px 0;">${t.noData}</div>` : ''}
                    </div>`;
                }

                let isOwner = auth.currentUser && d.owner === auth.currentUser.uid;
                let isClickable = isOwner || d.sport === "FUDBAL";
                let cursorStyle = isClickable ? "cursor: pointer;" : "cursor: default;";

                cardBody = `
                <div class="tv-card-wrapper" style="${cursorStyle}">
                    <div class="tv-card ${isLive?'tv-live':''}">
                        <div class="tv-league">${d.league || t.localMatch}</div>
                        <div class="tv-team-row">
                            <div class="tv-team-name">${(d.t1 || t.team1).substring(0,10)}</div>
                            <div class="tv-team-score">${s1}</div>${p1Html}${curr1}
                        </div>
                        <div class="tv-team-row" style="border-bottom:none;">
                            <div class="tv-team-name">${(d.t2 || t.team2).substring(0,10)}</div>
                            <div class="tv-team-score">${s2}</div>${p2Html}${curr2}
                        </div>
                        <div class="tv-bottom-bar"><span style="display:flex; align-items:center; gap:4px;">${ball} ${sportName}</span><span>${statusText}</span></div>
                    </div>${inlineDetails}
                </div><div class="marker-pointer"></div>`;
            } else {
                cardBody = `
                <div class="tv-card-wrapper">
                    <div class="tv-card" style="padding:14px; text-align:center; font-weight:800; font-size:13px; color:var(--primary); border-left:4px solid rgba(255,255,255,0.2);">
                        ${ball}${d.name}
                    </div>
                </div><div class="marker-pointer"></div>`;
            }
            
            const hoverHtml = `<div class="hover-tooltip">${d.t1 || t.team1} <span style="color:var(--primary); font-size:8px;">VS</span> ${d.t2 || t.team2}</div>`;
            const fullHtml = `<div class="sport-marker-wrapper ${isLive?'status-live-wrapper':''}${zoomNear?'zoom-near':''}"><div class="marker-content-box"><div class="marker-ball-only">${ball}${hoverHtml}</div>${cardBody}</div></div>`;
            
            if (activeMarkers[key]) {
                activeMarkers[key].setLatLng([d.lat, d.lng]);
                activeMarkers[key].setIcon(L.divIcon({ className: '', html: fullHtml, iconSize: [0,0] }));
            } else {
                let marker = L.marker([d.lat, d.lng], { icon: L.divIcon({ className: '', html: fullHtml, iconSize: [0,0] }) }).addTo(map);
                marker.on('click', e => { 
                    L.DomEvent.stopPropagation(e); 
                    if (map.getZoom() <= 12) {
                        map.flyTo([d.lat, d.lng], 15);
                    } else {
                        if (auth.currentUser && d.owner === auth.currentUser.uid) {
                            openAdmin(key); 
                        } else if (d.sport === "FUDBAL") {
                            let inlineEl = document.getElementById('inline-' + key);
                            if (inlineEl) inlineEl.style.display = inlineEl.style.display === 'flex' ? 'none' : 'flex';
                        }
                    }
                });
                activeMarkers[key] = marker;
            }
        }

        function removeMarker(key) {
            if (activeMarkers[key]) { map.removeLayer(activeMarkers[key]); delete activeMarkers[key]; }
        }

        function reRenderAllMarkers() {
            Object.keys(allTereniData).forEach(key => renderSingleMarker(key));
        }

        function handleMapClick(e) { 
            if (!auth.currentUser) return; 
            const t = translations[currentLang]; 
            const clickPos = e.latlng; 
            
            let isTooClose = false;
            Object.values(allTereniData).forEach(court => { 
                if(clickPos.distanceTo(L.latLng(court.lat, court.lng)) < 200) isTooClose = true; 
            });
            if (isTooClose) { showAppAlert(t.zoneOccupied); return; } 
            
            const sp = t.sports || { "FUDBAL": "FUDBAL", "KOŠARKA": "KOŠARKA", "ODBOJKA": "ODBOJKA", "TENIS": "TENIS", "RUKOMET": "RUKOMET" };

            const html = `
                <div style="padding:12px 6px; text-align:center; display: flex; flex-direction: column; gap: 16px;">
                    <h3 style="margin: 0; font-family:'Oswald', sans-serif; color:var(--primary); font-size:18px; letter-spacing: 1px;">${t.addCourt || 'DODAJ TEREN'}</h3>
                    <select id="p_sport" style="width: 100%; margin: 0; padding: 14px; font-size:15px!important; border-radius:12px;">
                        <option value="FUDBAL">⚽ ${sp.FUDBAL}</option>
                        <option value="KOŠARKA">🏀 ${sp.KOŠARKA}</option>
                        <option value="ODBOJKA">🏐 ${sp.ODBOJKA}</option>
                        <option value="TENIS">🎾 ${sp.TENIS}</option>
                        <option value="RUKOMET">🤾 ${sp.RUKOMET}</option>
                    </select>
                    <input type="text" id="p_name" placeholder="${t.courtName}" maxlength="15" style="width: 100%; margin: 0; padding: 14px; font-size:15px!important; border-radius:12px;">
                    <button onclick="saveTeren(${e.latlng.lat}, ${e.latlng.lng})" class="btn-primary" style="width: 100\%; margin: 0; padding: 16px; font-size:16px!important; border-radius:12px;">${t.create}</button>
                </div>`; 
            L.popup().setLatLng(e.latlng).setContent(html).openOn(map); 
        }

        async function saveTeren(lat, lng) { 
            const n = document.getElementById('p_name').value.toUpperCase();
            let myCourtsCount = 0;
            Object.values(allTereniData).forEach(t => { if(t.owner === auth.currentUser.uid) myCourtsCount++; });
            if (myCourtsCount >= 3) { showAppAlert(translations[currentLang].limitReached); return; }
            await db.ref('tereni').push({ name: n, lat, lng, owner: auth.currentUser.uid, sport: document.getElementById('p_sport').value, status: 'upcoming', score1: 0, score2: 0 }); 
            map.closePopup(); 
        }

            el.classList.remove('anim-score'); void el.offsetWidth; el.classList.add('anim-score');
        }

                const pts2 = isTB ? (d.p2 || 0) : (tennisPoints[d.p2] || "0");
